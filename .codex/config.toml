# Configuracion local del kit. No cambia permisos, credenciales ni ajustes globales.
# El cliente debe admitir estos modelos y cargar la configuracion del proyecto.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"
